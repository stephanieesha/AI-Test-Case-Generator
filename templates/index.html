<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Case Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #854e5c;
      --accent-dark: #6f3f4c;
      --accent-tint: #f7eef1;
      --border: #dfdadc;
      --input-border: #d7d0d2;
      --text: #000;
      --muted: #6f6a6c;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sans: 'Work Sans', -apple-system, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--sans);
      font-weight: 600;
      margin: 0;
      background: #fff;
      color: var(--text);
    }
    header {
      padding: 20px 32px;
      background: var(--accent);
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26.7px;
      font-weight: 600;
      line-height: 1.33;
    }
    .layout {
      display: flex;
      gap: 24px;
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      flex: 1;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px 27px 27px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .jira-row { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 17px;
      border: 1px solid var(--input-border);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: inherit;
    }
    textarea {
      min-height: 160px;
      padding: 12px 16px;
      border-radius: 12px;
      resize: vertical;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: #8a8386; }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      padding: 10px 16px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button.secondary { background: #fff; color: var(--text); }
    button.secondary:hover { background: var(--accent-tint); border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .generate-btn { width: 100%; margin-top: 12px; padding: 12px; font-size: 14px; }
    .style-row { display: flex; gap: 10px; margin-top: 16px; }
    .style-option {
      flex: 1;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      font-size: 12px;
    }
    .style-option:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .style-option input { margin-top: 3px; accent-color: var(--accent); }
    .style-option strong { display: block; font-size: 12px; font-weight: 700; }
    .style-option span { display: block; color: var(--text); font-size: 10px; margin-top: 2px; }
    .step-case, .test-case {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .step-case h3, .test-case h3 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
    }
    .step-case .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 10px 0 4px;
    }
    .step-case ul, .test-case ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text); }
    .step-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .step-num { font-weight: 700; color: var(--accent); min-width: 20px; }
    .step-content .action { color: var(--text); }
    .step-content .expected { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .ambiguity-box {
      background: var(--accent-tint);
      border: 1px solid #e6d3d8;
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 16px;
    }
    .ambiguity-box h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
    .ambiguity-box ul { margin: 0; padding-left: 18px; font-size: 13px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 16px; }
    .copy-btn { margin-top: 12px; }
    .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 0; }
    .error-box {
      background: #fbeeee; border: 1px solid #e8c4c4; color: #8a1c1c;
      padding: 12px 16px; border-radius: 12px; font-size: 13px;
    }
    #fetchError:not(:empty) { margin-top: 12px; }
  </style>
</head>
<body>
  <header><h1>Test Case Generator</h1></header>

  <div class="layout">
    <div class="panel">
      <h2>Requirement</h2>
      <div class="jira-row">
        <input type="text" id="jiraKey" placeholder="Jira ticket key, e.g. PROJ-123" />
        <button class="secondary" onclick="fetchJira()">Fetch from Jira</button>
      </div>
      <textarea id="requirement" placeholder="Paste a requirement here, or fetch one from Jira above..."></textarea>

      <div class="style-row">
        <label class="style-option">
          <input type="radio" name="style" value="bdd" checked />
          <div>
            <strong>BDD (Given/When/Then)</strong>
            <span>Quick validation during testing</span>
          </div>
        </label>
        <label class="style-option">
          <input type="radio" name="style" value="step_by_step" />
          <div>
            <strong>Step-by-Step / Multi-Stage</strong>
            <span>Detailed, repeatable execution for complex processes</span>
          </div>
        </label>
      </div>

      <button class="generate-btn" onclick="generate()" id="generateBtn">Generate test cases</button>
      <div id="fetchError"></div>
    </div>

    <div class="panel">
      <h2>Generated output</h2>
      <div id="output">
        <div class="empty-state">Test cases will appear here.</div>
      </div>
    </div>
  </div>

  <script>
    async function fetchJira() {
      const key = document.getElementById('jiraKey').value.trim();
      const errorDiv = document.getElementById('fetchError');
      errorDiv.innerHTML = '';
      if (!key) return;

      try {
        const res = await fetch(`/jira/${encodeURIComponent(key)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to fetch ticket');
        document.getElementById('requirement').value = data.requirement;
      } catch (err) {
        errorDiv.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
      }
    }

    async function generate() {
      const requirement = document.getElementById('requirement').value.trim();
      const style = document.querySelector('input[name="style"]:checked').value;
      const output = document.getElementById('output');
      const btn = document.getElementById('generateBtn');

      if (!requirement) {
        output.innerHTML = '<div class="error-box">Enter a requirement first.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating...';
      output.innerHTML = '<div class="empty-state">Generating...</div>';

      try {
        const res = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requirement, style }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Generation failed');
        renderResult(data);
      } catch (err) {
        output.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate test cases';
      }
    }

    function renderResult(data) {
      const output = document.getElementById('output');
      let html = '';

      if (data.style === 'step_by_step') {
        data.test_cases.forEach((tc) => {
          html += `<div class="step-case"><h3>${escapeHtml(tc.title)}</h3>`;

          if (tc.preconditions && tc.preconditions.length) {
            html += '<div class="section-label">Preconditions</div><ul>';
            tc.preconditions.forEach((p) => { html += `<li>${escapeHtml(p)}</li>`; });
            html += '</ul>';
          }
          if (tc.test_data && tc.test_data.length) {
            html += '<div class="section-label">Test data</div><ul>';
            tc.test_data.forEach((d) => { html += `<li>${escapeHtml(d)}</li>`; });
            html += '</ul>';
          }

          html += '<div class="section-label">Steps</div>';
          tc.steps.forEach((step) => {
            html += `<div class="step-row"><span class="step-num">${step.step_number}.</span>`;
            html += `<div class="step-content"><div class="action">${escapeHtml(step.action)}</div>`;
            html += `<div class="expected">Expected: ${escapeHtml(step.expected_result)}</div></div></div>`;
          });

          if (tc.postconditions && tc.postconditions.length) {
            html += '<div class="section-label">Postconditions</div><ul>';
            tc.postconditions.forEach((p) => { html += `<li>${escapeHtml(p)}</li>`; });
            html += '</ul>';
          }
          html += '</div>';
        });
      } else {
        data.test_cases.forEach((tc) => {
          html += `<div class="test-case"><h3>${escapeHtml(tc.title)}</h3><ul>`;
          tc.steps.forEach((step) => {
            html += `<li>${escapeHtml(step)}</li>`;
          });
          html += '</ul></div>';
        });
      }

      if (data.ambiguity_notes && data.ambiguity_notes.length > 0) {
        html += '<div class="ambiguity-box"><h3>Ambiguity flags</h3><ul>';
        data.ambiguity_notes.forEach((note) => {
          html += `<li>${escapeHtml(note)}</li>`;
        });
        html += '</ul></div>';
      }

      html += `<div class="meta">Grounded in: ${data.retrieved_examples.join(', ')}</div>`;
      html += `<button class="copy-btn secondary" onclick="copyOutput()">Copy as text</button>`;

      output.innerHTML = html;
      window._lastResult = data;
    }

    function copyOutput() {
      const data = window._lastResult;
      if (!data) return;

      let text = '';

      if (data.style === 'step_by_step') {
        data.test_cases.forEach((tc) => {
          text += `${tc.title}\n`;
          if (tc.preconditions && tc.preconditions.length) {
            text += 'Preconditions:\n';
            tc.preconditions.forEach((p) => { text += `  - ${p}\n`; });
          }
          if (tc.test_data && tc.test_data.length) {
            text += 'Test data:\n';
            tc.test_data.forEach((d) => { text += `  - ${d}\n`; });
          }
          tc.steps.forEach((step) => {
            text += `  ${step.step_number}. ${step.action}\n     Expected: ${step.expected_result}\n`;
          });
          if (tc.postconditions && tc.postconditions.length) {
            text += 'Postconditions:\n';
            tc.postconditions.forEach((p) => { text += `  - ${p}\n`; });
          }
          text += '\n';
        });
      } else {
        data.test_cases.forEach((tc) => {
          text += `${tc.title}\n`;
          tc.steps.forEach((step) => { text += `  ${step}\n`; });
          text += '\n';
        });
      }

      if (data.ambiguity_notes && data.ambiguity_notes.length > 0) {
        text += 'Ambiguity flags:\n';
        data.ambiguity_notes.forEach((note) => { text += `- ${note}\n`; });
      }

      navigator.clipboard.writeText(text);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
