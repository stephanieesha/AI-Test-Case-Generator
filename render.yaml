services:
  - type: web
    name: test-case-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the usage limits are counted in memory.
    startCommand: gunicorn --chdir src app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: DISABLE_JIRA
        value: "true"        # never let strangers read your Jira tickets
      - key: GENERATE_LIMIT_PER_HOUR
        value: "5"
      - key: DAILY_GENERATION_LIMIT
        value: "30"
      - key: MAX_REQUIREMENT_CHARS
        value: "4000"
